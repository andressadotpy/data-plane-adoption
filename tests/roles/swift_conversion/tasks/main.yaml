- name: Patch the OpenStackControlPlane CR to change the Swift default storage ports
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    {{ cells_env }}

    cat > swift-config-patch.yaml << EOF
    spec:
      swift:
        template:
          swiftStorage:
            defaultConfigOverwrite:
              01-account-server.conf: |
                [DEFAULT]
                bind_port = 6002
              01-container-server.conf: |
                [DEFAULT]
                bind_port = 6001
              01-object-server.conf: |
                [DEFAULT]
                bind_port = 6000
    EOF

- name: Apply the patch file
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    oc patch openstackcontrolplane {{ ctlplane_name }} --type=merge --patch-file=swift-config-patch.yaml

- name: Wait for OpenStackControlPlane to reconcile after Swift port patch
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    oc wait --for condition=Ready --timeout=5m openstackcontrolplane/{{ ctlplane_name }}

- name: Create OpenStackDataPlaneService for Swift conversion
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    oc apply -f - <<EOF
    apiVersion: dataplane.openstack.org/v1beta1
    kind: OpenStackDataPlaneService
    metadata:
      name: swift-conversion
    spec:
      addCertMounts: false
      caCerts: combined-ca-bundle
      edpmServiceType: swift
      dataSources:
      - secretRef:
          name: swift-conf
      - configMapRef:
          name: swift-storage-config-data
      - configMapRef:
          name: swift-ring-files
      playbookContents: |
        - name: Cleanup and deploy Swift
          hosts: "{{ edpm_override_hosts | default('all', true) }}"
          serial: 1
          strategy: linear
          gather_facts: "{{ gather_facts | default(false) }}"
          any_errors_fatal: "{{ edpm_any_errors_fatal | default(true) }}"
          max_fail_percentage: "{{ edpm_max_fail_percentage | default(0) }}"
          environment: "{{ edpm_playbook_environment | default({}) }}"
          tasks:
            - ansible.builtin.import_role:
                name: osp.edpm.edpm_tripleo_cleanup
            - ansible.builtin.import_role:
                name: osp.edpm.edpm_swift
    EOF

- name: Create OpenStackDataPlaneNodeSet for Swift node conversion
  no_log: "{{ use_no_log }}"
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    oc apply -f - <<EOF
    {{ swift_conversion_nodeset }}
    EOF

- name: Create OpenStackDataPlaneDeployment to trigger conversion
  no_log: "{{ use_no_log }}"
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    oc apply -f - <<EOF
    apiVersion: dataplane.openstack.org/v1beta1
    kind: OpenStackDataPlaneDeployment
    metadata:
      name: {{ swift_conversion_deployment_name }}
      namespace: openstack
    spec:
      nodeSets:
      - {{ swift_conversion_nodeset_name }}
    EOF

- name: Wait for the Swift node conversion deployment to finish
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    oc wait --for condition=Ready openstackdataplanedeployment/{{ swift_conversion_deployment_name }} --timeout=30m

- name: Verify 13 edpm_swift services running on converted node
  ansible.builtin.shell: |
    {{ shell_header }}
    count=$(ssh -o StrictHostKeyChecking=accept-new -i {{ edpm_privatekey_path }} {{ edpm_user }}@{{ standalone_ip | default(edpm_node_ip) }} \
      "sudo systemctl list-units 'edpm_swift_*' --state=active --no-legend | wc -l")
    [ "$count" -eq 13 ] || (echo "Expected 13 edpm_swift services, found $count"; exit 1)

- name: Verify old 17.1 Swift containers are removed
  ansible.builtin.shell: |
    {{ shell_header }}
    ssh -o StrictHostKeyChecking=accept-new -i {{ edpm_privatekey_path }} {{ edpm_user }}@{{ standalone_ip | default(edpm_node_ip) }} \
      "sudo podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -E '^swift_(account|container|object|rsync)$' || true"
  register: old_containers_check
  changed_when: false
  failed_when: old_containers_check.stdout | length > 0 and swift_conversion_require_cleanup | bool

- name: Verify Swift servers listening on legacy ports 6000/6001/6002
  ansible.builtin.shell: |
    {{ shell_header }}
    ssh -o StrictHostKeyChecking=accept-new -i {{ edpm_privatekey_path }} {{ edpm_user }}@{{ standalone_ip | default(edpm_node_ip) }} \
      "sudo ss -tlnp | grep -qE ':6000' && sudo ss -tlnp | grep -qE ':6001' && sudo ss -tlnp | grep -qE ':6002'"

- name: Verify nftables allows legacy Swift ports 6000/6001/6002
  ansible.builtin.shell: |
    {{ shell_header }}
    ssh -o StrictHostKeyChecking=accept-new -i {{ edpm_privatekey_path }} {{ edpm_user }}@{{ standalone_ip | default(edpm_node_ip) }} \
      "sudo nft list table inet filter | grep -qE 'dport 6000' && \
       sudo nft list table inet filter | grep -qE 'dport 6001' && \
       sudo nft list table inet filter | grep -qE 'dport 6002'"

- name: Verify ring uses legacy port 6000 and is balanced
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    oc debug job/swift-ring-rebalance -- /bin/sh -c '
      swift-ring-tool get
      swift-ring-builder object.builder search _ | grep -q " 6000 " || (echo "Ring not using port 6000"; exit 1)
    '

- name: Verify Swift replicators are active on converted node
  ansible.builtin.shell: |
    {{ shell_header }}
    ssh -o StrictHostKeyChecking=accept-new -i {{ edpm_privatekey_path }} {{ edpm_user }}@{{ standalone_ip | default(edpm_node_ip) }} "
      for svc in edpm_swift_object_replicator edpm_swift_container_replicator edpm_swift_account_replicator; do
        sudo systemctl is-active \$svc || (echo \$svc not active; exit 1)
      done
    "

- name: Verify Swift services are running on converted node
  ansible.builtin.shell: |
    {{ shell_header }}
    ssh -o StrictHostKeyChecking=accept-new -i {{ edpm_privatekey_path }} {{ edpm_user }}@{{ standalone_ip | default(edpm_node_ip) }} "sudo systemctl status edpm_swift_*"

- name: Verify Swift is functional after conversion
  ansible.builtin.shell: |
    {{ shell_header }}
    {{ oc_header }}
    oc rsh openstackclient /bin/sh -c '
      echo swift-conversion-probe > /tmp/swiftobj
      openstack container create test-conversion
      openstack object create test-conversion /tmp/swiftobj --name probe
      openstack object save test-conversion probe --file /tmp/swiftobj-readback
      cmp /tmp/swiftobj /tmp/swiftobj-readback || (echo Content mismatch on read-back; exit 1)
      openstack object delete test-conversion probe
      openstack container delete test-conversion
    '
